name: Book Manifest Schemas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # No check reads these, so a pull request that only touches them skips CI. Pushes to main always run.
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"

# A new push to a pull request cancels its previous run. Each run on main has its own group, so it always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","home-ci-bm"]') }}
    strategy:
      matrix:
        # The package must import with plain Node ESM on every maintained Node line (scripts/smoke-node-esm.mjs).
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      # No cache: npm here. The self-hosted runners keep ~/.npm between jobs, and restoring GitHub's copy of it is slower.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - name: Committed dist/ matches the build
        run: |
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)"
      - run: npm test
      - run: npm run typecheck
      - run: npm run validate
